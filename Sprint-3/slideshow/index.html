<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slideshow</title>
    <script defer src="slideshow.js"></script>
  </head>
  <body>
    <img
      id="carousel-img"
      src="./assets/cute-cat-a.png"
      alt="cute cat"
    />
   

      <div class="manual-controls">
        <button id="backward-btn">Previous</button>
        <button id="forward-btn">Next</button>
      </div>

      <div class="auto-controls">
        <button id="auto-backward">Auto Backward</button>
        <button id="auto-forward">Auto Forward</button>
        <button id="stop">Stop</button>
      </div>
    </div>
  </body>
</html>
